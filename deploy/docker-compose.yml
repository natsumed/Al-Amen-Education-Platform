services:
  prod-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD:?PROD_POSTGRES_PASSWORD is required}
    volumes:
      - prod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  prod-app:
    image: ${IMAGE_NAME:?IMAGE_NAME is required}:${PROD_IMAGE_TAG:?PROD_IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTH_TRUST_HOST: "true"
      # Auth.js must generate redirects for the public domain, never the
      # container hostname used on the private Docker network.
      AUTH_URL: https://amanallahedition.com
      NEXTAUTH_URL: https://amanallahedition.com
      DATABASE_URL: postgresql://platform:${PROD_POSTGRES_PASSWORD}@prod-db:5432/platform?schema=public
      AUTH_SECRET: ${PROD_AUTH_SECRET:?PROD_AUTH_SECRET is required}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      REDIS_URL: redis://prod-valkey:6379
      DATA_ENCRYPTION_KEY: ${PROD_DATA_ENCRYPTION_KEY:?PROD_DATA_ENCRYPTION_KEY is required}
      AUDIT_HASH_KEY: ${PROD_AUDIT_HASH_KEY:?PROD_AUDIT_HASH_KEY is required}
      ALLOW_LEGACY_MEDIA: ${PROD_ALLOW_LEGACY_MEDIA:-true}
      MOBILE_NATIVE_CONTENT_ONLY: ${PROD_MOBILE_NATIVE_CONTENT_ONLY:-false}
      SECURE_CONTENT_ENABLED: ${PROD_SECURE_CONTENT_ENABLED:-false}
      VDOCIPHER_API_SECRET: ${VDOCIPHER_API_SECRET:-}
      MOBILE_ATTESTATION_ENFORCED: ${MOBILE_ATTESTATION_ENFORCED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_INGESTION_MODEL: ${OPENAI_INGESTION_MODEL:-gpt-5-mini}
      CLICTOPAY_ENABLED: ${CLICTOPAY_ENABLED:-false}
      CLICTOPAY_MERCHANT_ID: ${CLICTOPAY_MERCHANT_ID:-}
      CLICTOPAY_API_URL: ${CLICTOPAY_API_URL:-}
      CLICTOPAY_API_SECRET: ${CLICTOPAY_API_SECRET:-}
      NEXT_PUBLIC_APP_URL: https://amanallahedition.com
      NEXT_PUBLIC_APP_NAME: Amenallah Edition
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-}
      SMTP_HOST: ${SMTP_HOST:-mail.spacemail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-Amenallah Edition <support@amanallahedition.com>}"
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-support@amanallahedition.com}
      EMAIL_WORKER_ENABLED: ${EMAIL_WORKER_ENABLED:-true}
    depends_on:
      prod-db:
        condition: service_healthy
      prod-valkey:
        condition: service_healthy
    volumes:
      - /srv/amenallah/releases:/srv/amenallah/releases:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://' + process.env.HOSTNAME + ':3000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  prod-email-worker:
    image: ${IMAGE_NAME:?IMAGE_NAME is required}:${PROD_IMAGE_TAG:?PROD_IMAGE_TAG is required}
    restart: unless-stopped
    command: ["node", "scripts/email-worker.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://platform:${PROD_POSTGRES_PASSWORD}@prod-db:5432/platform?schema=public
      DATA_ENCRYPTION_KEY: ${PROD_DATA_ENCRYPTION_KEY:?PROD_DATA_ENCRYPTION_KEY is required}
      SMTP_HOST: ${SMTP_HOST:-mail.spacemail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-Amenallah Edition <support@amanallahedition.com>}"
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-support@amanallahedition.com}
      EMAIL_WORKER_ENABLED: ${EMAIL_WORKER_ENABLED:-true}
    depends_on:
      prod-db:
        condition: service_healthy

  prod-valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - prod_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  staging-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD is required}
    volumes:
      - staging_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  staging-app:
    image: ${IMAGE_NAME:?IMAGE_NAME is required}:${STAGING_IMAGE_TAG:?STAGING_IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTH_TRUST_HOST: "true"
      AUTH_URL: https://staging.amanallahedition.com
      NEXTAUTH_URL: https://staging.amanallahedition.com
      DATABASE_URL: postgresql://platform:${STAGING_POSTGRES_PASSWORD}@staging-db:5432/platform?schema=public
      AUTH_SECRET: ${STAGING_AUTH_SECRET:?STAGING_AUTH_SECRET is required}
      AUTH_GOOGLE_ID: ${STAGING_AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${STAGING_AUTH_GOOGLE_SECRET:-}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      REDIS_URL: redis://staging-valkey:6379
      DATA_ENCRYPTION_KEY: ${STAGING_DATA_ENCRYPTION_KEY:?STAGING_DATA_ENCRYPTION_KEY is required}
      AUDIT_HASH_KEY: ${STAGING_AUDIT_HASH_KEY:?STAGING_AUDIT_HASH_KEY is required}
      ALLOW_LEGACY_MEDIA: ${STAGING_ALLOW_LEGACY_MEDIA:-true}
      MOBILE_NATIVE_CONTENT_ONLY: ${STAGING_MOBILE_NATIVE_CONTENT_ONLY:-false}
      SECURE_CONTENT_ENABLED: ${STAGING_SECURE_CONTENT_ENABLED:-false}
      VDOCIPHER_API_SECRET: ${VDOCIPHER_API_SECRET:-}
      MOBILE_ATTESTATION_ENFORCED: ${MOBILE_ATTESTATION_ENFORCED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_INGESTION_MODEL: ${OPENAI_INGESTION_MODEL:-gpt-5-mini}
      CLICTOPAY_ENABLED: ${CLICTOPAY_ENABLED:-false}
      CLICTOPAY_MERCHANT_ID: ${CLICTOPAY_MERCHANT_ID:-}
      CLICTOPAY_API_URL: ${CLICTOPAY_API_URL:-}
      CLICTOPAY_API_SECRET: ${CLICTOPAY_API_SECRET:-}
      NEXT_PUBLIC_APP_URL: https://staging.amanallahedition.com
      NEXT_PUBLIC_APP_NAME: Amenallah Edition (Staging)
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-}
      SMTP_HOST: ${SMTP_HOST:-mail.spacemail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-Amenallah Edition <support@amanallahedition.com>}"
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-support@amanallahedition.com}
      EMAIL_WORKER_ENABLED: ${EMAIL_WORKER_ENABLED:-true}
    depends_on:
      staging-db:
        condition: service_healthy
      staging-valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://' + process.env.HOSTNAME + ':3000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  staging-email-worker:
    image: ${IMAGE_NAME:?IMAGE_NAME is required}:${STAGING_IMAGE_TAG:?STAGING_IMAGE_TAG is required}
    restart: unless-stopped
    command: ["node", "scripts/email-worker.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://platform:${STAGING_POSTGRES_PASSWORD}@staging-db:5432/platform?schema=public
      DATA_ENCRYPTION_KEY: ${STAGING_DATA_ENCRYPTION_KEY:?STAGING_DATA_ENCRYPTION_KEY is required}
      SMTP_HOST: ${SMTP_HOST:-mail.spacemail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-Amenallah Edition <support@amanallahedition.com>}"
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-support@amanallahedition.com}
      EMAIL_WORKER_ENABLED: ${EMAIL_WORKER_ENABLED:-true}
    depends_on:
      staging-db:
        condition: service_healthy

  staging-valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - staging_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: amanallahedition.com
      STAGING_DOMAIN: staging.amanallahedition.com
      TLS_EMAIL: ${TLS_EMAIL:?TLS_EMAIL is required}
      STAGING_BASIC_AUTH_USER: ${STAGING_BASIC_AUTH_USER:?STAGING_BASIC_AUTH_USER is required}
      STAGING_BASIC_AUTH_HASH: ${STAGING_BASIC_AUTH_HASH:?STAGING_BASIC_AUTH_HASH is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/amenallah/releases:/srv/amenallah/releases:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      prod-app:
        condition: service_healthy
      staging-app:
        condition: service_healthy

volumes:
  prod_db_data:
  prod_valkey_data:
  staging_db_data:
  staging_valkey_data:
  caddy_data:
  caddy_config:
