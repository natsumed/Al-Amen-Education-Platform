name: Mobile release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform
        required: true
        type: choice
        options: [android-direct, android-store, ios-testflight]
      publish_android:
        description: Publish the verified Android APK after production approval
        required: true
        default: false
        type: boolean
      google_enabled:
        description: Enable native Google sign-in in this release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --audit=false
      - run: npx tsc --noEmit
      - run: npx expo-doctor
      - run: npm audit --audit-level=critical
      - run: npx expo prebuild --clean --platform android --no-install --non-interactive

  build:
    needs: validate
    runs-on: ubuntu-latest
    environment: mobile-release
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # The direct Gradle fallback does not read eas.json env entries. Keep
      # the standalone APK pointed at the canonical HTTPS API as well.
      EXPO_PUBLIC_API_URL: https://amanallahedition.com
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
      MOBILE_GOOGLE_ENABLED: ${{ inputs.google_enabled }}
      MOBILE_RELEASE_PLATFORM: android
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --audit=false
      - name: Validate production mobile configuration
        run: node ../scripts/assert-mobile-release-config.mjs
      - name: Require EAS credentials for store/iOS builds
        if: inputs.platform != 'android-direct' && env.EXPO_TOKEN == ''
        run: |
          echo "EXPO_TOKEN is required for Android Store and iOS TestFlight builds."
          exit 1
      - name: Build immutable EAS artifact
        if: env.EXPO_TOKEN != ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          npx --yes eas-cli@21.2.0 build --platform ${{ startsWith(inputs.platform, 'android') && 'android' || 'ios' }} --profile ${{ inputs.platform }} --non-interactive --wait --json > build.json
          jq -e -r '.[0].id' build.json > build-id.txt
      - name: Build local standalone Android artifact
        if: inputs.platform == 'android-direct' && env.EXPO_TOKEN == ''
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          npx expo prebuild --clean --platform android --no-install --non-interactive
          test -f android/gradlew
          # VdoCipher publishes its Android SDK in a GitHub Maven repository.
          # Expo's generated project otherwise only searches Google/Maven Central
          # (and the package-level repository is not consistently inherited by
          # Gradle's dependency resolution management).
          sed -i "/mavenCentral()/a\\    maven { url 'https://github.com/VdoCipher/maven-repo/raw/master/repo' }" android/build.gradle
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/amenallah-release.keystore
          export ANDROID_KEYSTORE_PATH="$PWD/android/app/amenallah-release.keystore"
          node ../scripts/configure-android-release-signing.mjs android/app/build.gradle
          mkdir -p dist
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../dist/amenallah.apk
      - name: Download and verify the exact Android APK
        if: inputs.platform == 'android-direct' && env.EXPO_TOKEN != ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID="$(cat build-id.txt)"
          mkdir -p dist
          npx --yes eas-cli@21.2.0 build:download --id "$BUILD_ID" --path ./dist/amenallah.apk
      - name: Verify Android APK and write immutable metadata
        if: inputs.platform == 'android-direct'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apksigner aapt
          apksigner verify --verbose --print-certs dist/amenallah.apk
          aapt dump badging dist/amenallah.apk | grep -F "package: name='tn.amenallah.education' versionCode='6' versionName='1.3.0'"
          ! aapt dump permissions dist/amenallah.apk | grep -F 'android.permission.RECORD_AUDIO'
          unzip -p dist/amenallah.apk assets/index.android.bundle | strings | grep -F 'https://amanallahedition.com'
          ! unzip -p dist/amenallah.apk assets/index.android.bundle | strings | grep -E 'localhost|127\\.0\\.0\\.1|10\\.0\\.2\\.2|REPLACE_WITH_YOUR_API_HOST'
          SIGNING_CERTS="$(apksigner verify --print-certs dist/amenallah.apk)"
          ! printf '%s' "$SIGNING_CERTS" | grep -qi 'CN=Android Debug'
          VERSION="$(node -p "require('./app.json').expo.version")"
          BUILD="$(node -p "require('./app.json').expo.android.versionCode")"
          SIGNATURE="$(apksigner verify --print-certs dist/amenallah.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':')"
          test -n "$SIGNATURE"
          SHA256="$(sha256sum dist/amenallah.apk | awk '{print $1}')"
          SIZE="$(stat -c%s dist/amenallah.apk)"
          BUILD_ID="${BUILD_ID:-local-gradle}"
          printf 'VERSION=%s\nBUILD=%s\nSIGNATURE=%s\nSHA256=%s\nSIZE=%s\nBUILD_ID=%s\n' "$VERSION" "$BUILD" "$SIGNATURE" "$SHA256" "$SIZE" "$BUILD_ID" > dist/metadata.env
          printf '%s  %s\n' "$SHA256" amenallah.apk > dist/amenallah.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-${{ inputs.platform }}-${{ github.sha }}
          path: mobile/dist
          if-no-files-found: error

  publish:
    if: inputs.publish_android && inputs.platform == 'android-direct'
    needs: build
    runs-on: ubuntu-latest
    environment: production-mobile
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mobile-${{ inputs.platform }}-${{ github.sha }}
          path: dist
      - name: Configure restricted deployment access
        env:
          MOBILE_RELEASE_SSH_KEY: ${{ secrets.MOBILE_RELEASE_SSH_KEY }}
          MOBILE_RELEASE_SSH_KNOWN_HOSTS: ${{ secrets.MOBILE_RELEASE_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$MOBILE_RELEASE_SSH_KEY"
          test -n "$MOBILE_RELEASE_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MOBILE_RELEASE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$MOBILE_RELEASE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload, register, verify, then publish
        env:
          MOBILE_RELEASE_SSH_HOST: ${{ secrets.MOBILE_RELEASE_SSH_HOST }}
          MOBILE_RELEASE_SSH_USER: ${{ secrets.MOBILE_RELEASE_SSH_USER }}
          MOBILE_RELEASE_SSH_PORT: ${{ secrets.MOBILE_RELEASE_SSH_PORT }}
        run: |
          test -n "$MOBILE_RELEASE_SSH_HOST"
          test -n "$MOBILE_RELEASE_SSH_USER"
          source dist/metadata.env
          PORT="${MOBILE_RELEASE_SSH_PORT:-22}"
          REMOTE_TMP="/tmp/amenallah-${GITHUB_SHA}.apk"
          scp -P "$PORT" -i ~/.ssh/id_ed25519 dist/amenallah.apk "$MOBILE_RELEASE_SSH_USER@$MOBILE_RELEASE_SSH_HOST:$REMOTE_TMP"
          MANIFEST="$(printf '{\"platform\":\"ANDROID\",\"artifactType\":\"APK\",\"version\":\"%s\",\"buildNumber\":%s,\"sha256\":\"%s\",\"signatureSha256\":\"%s\",\"sourceCommit\":\"%s\",\"packageName\":\"tn.amenallah.education\",\"signatureVerified\":true,\"sizeBytes\":%s,\"url\":\"/downloads/android/%s/%s/amenallah.apk\"}' "$VERSION" "$BUILD" "$SHA256" "$SIGNATURE" "$GITHUB_SHA" "$SIZE" "$VERSION" "$BUILD")"
          ENCODED_MANIFEST="$(printf '%s' "$MANIFEST" | base64 -w0)"
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "$MOBILE_RELEASE_SSH_USER@$MOBILE_RELEASE_SSH_HOST" "set -eu; sudo mkdir -p /srv/amenallah/releases/android/$VERSION/$BUILD; sudo install -o root -g root -m 0644 '$REMOTE_TMP' '/srv/amenallah/releases/android/$VERSION/$BUILD/amenallah.apk'; printf '%s' '$ENCODED_MANIFEST' | base64 -d | sudo tee '/srv/amenallah/releases/android/$VERSION/$BUILD/manifest.json' >/dev/null; sudo sha256sum '/srv/amenallah/releases/android/$VERSION/$BUILD/amenallah.apk' | sudo tee '/srv/amenallah/releases/android/$VERSION/$BUILD/amenallah.apk.sha256' >/dev/null; sudo rm -f '$REMOTE_TMP'; cd /opt/amenallah; sudo docker compose --env-file runtime.env -f docker-compose.yml exec -T prod-app node scripts/register-mobile-release.mjs '/srv/amenallah/releases/android/$VERSION/$BUILD/manifest.json'"
          URL="https://amanallahedition.com/downloads/android/$VERSION/$BUILD/amenallah.apk"
          curl -fsSI "$URL" | grep -qi 'content-type: application/vnd.android.package-archive'
          curl -fsSI "$URL" | grep -qi 'content-disposition: attachment'
          test "$(curl -fsSL -r 0-31 "$URL" | wc -c)" -eq 32
          curl -fsS "https://amanallahedition.com/api/mobile/releases/current?platform=ANDROID" | grep -q '"ready":false'
          test "$(curl -fsS "https://amanallahedition.com/api/mobile/releases/current?platform=ANDROID" | jq -r '.android.buildNumber')" != "$BUILD"
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "$MOBILE_RELEASE_SSH_USER@$MOBILE_RELEASE_SSH_HOST" "cd /opt/amenallah && sudo docker compose --env-file runtime.env -f docker-compose.yml exec -e MOBILE_RELEASE_PUBLISH=true -T prod-app node scripts/register-mobile-release.mjs '/srv/amenallah/releases/android/$VERSION/$BUILD/manifest.json'"
          curl -fsS "https://amanallahedition.com/api/mobile/releases/current?platform=ANDROID" | grep -q "\"buildNumber\":$BUILD"
